<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊寶典</title>

  <!-- Marked.js - Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --sidebar-width: 280px;
      --bg-primary: #faf8f5;
      --bg-sidebar: #242526;
      --bg-sidebar-hover: #313335;
      --bg-sidebar-active: rgba(245, 200, 66, 0.12);
      --text-primary: #2c3e50;
      --text-secondary: #606770;
      --text-sidebar: #b0b3b8;
      --text-sidebar-title: #e4e6eb;
      --text-sidebar-active: #f5c842;
      --accent: #c45a2c;
      --accent-light: #f6e7df;
      --border: #e4ded7;
      --blockquote-bg: #fbf7f0;
      --blockquote-border: #d4a359;
      --code-bg: #f3efe9;
      --badge-bg: rgba(255, 255, 255, 0.08);
      --badge-text: #9a9da3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.8;
    }

    /* ===== Sidebar ===== */
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--bg-sidebar);
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.28s ease;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(0, 0, 0, 0.2);
    }

    #sidebar-header {
      padding: 22px 18px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    #sidebar-header h2 {
      color: var(--text-sidebar-title);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    #sidebar-header .subtitle {
      color: var(--text-sidebar);
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Navigation Container */
    #nav-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0 24px;
    }

    /* Category Accordion */
    .category-group {
      margin-bottom: 4px;
    }

    .category-header {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-sidebar-title);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s, color 0.2s;
      user-select: none;
    }

    .category-header:hover {
      background: var(--bg-sidebar-hover);
      color: #fff;
    }

    .category-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-arrow {
      display: inline-block;
      width: 14px;
      height: 14px;
      line-height: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--text-sidebar);
      transition: transform 0.2s ease;
    }

    .category-group.open .category-arrow {
      transform: rotate(90deg);
    }

    .category-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 2px 7px;
      border-radius: 10px;
    }

    .category-pages {
      display: none;
      padding: 2px 0 6px;
    }

    .category-group.open .category-pages {
      display: block;
    }

    .page-item {
      display: block;
      padding: 7px 18px 7px 34px;
      color: var(--text-sidebar);
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
      line-height: 1.4;
    }

    .page-item:hover {
      background: var(--bg-sidebar-hover);
      color: #fff;
    }

    .page-item.active {
      color: #fff;
      background: var(--bg-sidebar-active);
      border-left-color: var(--text-sidebar-active);
      font-weight: 500;
    }

    .page-item .page-desc {
      display: block;
      font-size: 11px;
      color: #7b7f87;
      margin-top: 3px;
      font-weight: normal;
    }

    .page-item.active .page-desc {
      color: #c9cdd4;
    }

    /* Section: TOC */
    #toc-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    #toc-label {
      padding: 6px 18px 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #737882;
    }

    #toc {
      padding: 4px 0 16px;
    }

    #toc a {
      display: block;
      padding: 5px 18px 5px 24px;
      color: var(--text-sidebar);
      text-decoration: none;
      font-size: 12.5px;
      border-left: 3px solid transparent;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.5;
    }

    #toc a:hover {
      background: var(--bg-sidebar-hover);
      color: #fff;
    }

    #toc a.active {
      color: var(--text-sidebar-active);
      border-left-color: var(--text-sidebar-active);
      background: rgba(245, 200, 66, 0.08);
    }

    #toc a.toc-h2 {
      padding-left: 24px;
      font-weight: 500;
    }

    #toc a.toc-h3 {
      padding-left: 38px;
      font-size: 11.5px;
      color: #8b8f96;
    }

    /* ===== Main Content ===== */
    #main {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
    }

    #content {
      max-width: 860px;
      margin: 0 auto;
      padding: 44px 52px 90px;
    }

    /* ===== Mobile Elements ===== */
    #menu-toggle {
      display: none;
      position: fixed;
      top: 12px; left: 12px;
      z-index: 200;
      width: 40px; height: 40px;
      background: var(--bg-sidebar);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    #menu-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
    }

    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 99;
      backdrop-filter: blur(2px);
    }

    /* ===== Markdown Rendered Content Styles ===== */
    #content h1 {
      font-size: 27px;
      color: var(--accent);
      margin: 0 0 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent-light);
      line-height: 1.4;
    }

    #content h2 {
      font-size: 21px;
      color: var(--text-primary);
      margin: 44px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    #content h3 {
      font-size: 17px;
      color: var(--accent);
      margin: 30px 0 12px;
    }

    #content p { margin: 12px 0; }

    #content a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dotted var(--accent);
    }
    #content a:hover { border-bottom-style: solid; }

    #content blockquote {
      margin: 16px 0;
      padding: 16px 20px;
      background: var(--blockquote-bg);
      border-left: 4px solid var(--blockquote-border);
      border-radius: 0 8px 8px 0;
      font-size: 14px;
    }
    #content blockquote p { margin: 8px 0; }
    #content blockquote strong { color: var(--accent); }

    #content ul, #content ol { margin: 12px 0; padding-left: 24px; }
    #content li { margin: 8px 0; }
    #content li ul { margin: 4px 0; }

    #content code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    #content hr {
      border: none;
      border-top: 2px dashed var(--border);
      margin: 44px 0;
    }

    #content strong { color: #1a202c; }

    /* ===== Loading & Error States ===== */
    #loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }

    #loading .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      display: none;
      text-align: center;
      padding: 60px 20px;
      color: #b91c1c;
    }

    #error-msg code {
      display: block;
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 13px;
      white-space: pre-line;
      line-height: 1.6;
    }

    /* ===== Scroll to Top ===== */
    #scroll-top {
      position: fixed;
      bottom: 24px; right: 24px;
      width: 44px; height: 44px;
      background: var(--bg-sidebar);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 50;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scroll-top.visible { opacity: 1; transform: translateY(0); }
    #scroll-top:hover { background: var(--accent); }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay.open { display: block; }
      #main { margin-left: 0; }
      #content { padding: 68px 20px 80px; }
      #menu-toggle { display: flex; }
    }
  </style>
</head>
<body>

  <button id="menu-toggle" aria-label="切換選單">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <div id="sidebar-overlay"></div>

  <aside id="sidebar">
    <div id="sidebar-header">
      <h2 id="site-title">旅遊寶典</h2>
      <div class="subtitle" id="site-subtitle">載入中...</div>
    </div>

    <div id="nav-container">
      <div id="category-list"></div>

      <div id="toc-section">
        <div id="toc-label">本頁目錄</div>
        <nav id="toc"></nav>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="content">
      <div id="loading">
        <div class="spinner"></div>
        <div>載入文件中...</div>
      </div>
      <div id="error-msg">
        <div>無法載入文件</div>
        <code id="error-detail"></code>
      </div>
    </div>
  </main>

  <button id="scroll-top" title="回到頂部">Top</button>

  <script>
    const contentEl      = document.getElementById('content');
    const tocEl          = document.getElementById('toc');
    const loadingEl      = document.getElementById('loading');
    const errorEl        = document.getElementById('error-msg');
    const errorDetail    = document.getElementById('error-detail');
    const categoryListEl = document.getElementById('category-list');
    const siteTitle      = document.getElementById('site-title');
    const siteSubtitle   = document.getElementById('site-subtitle');
    const menuToggle     = document.getElementById('menu-toggle');
    const sidebar        = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const scrollTopBtn   = document.getElementById('scroll-top');

    let pagesConfig = null;
    let allPages = [];
    let currentPage = null;
    let scrollObserver = null;

    marked.setOptions({ breaks: true, gfm: true });

    function slugify(file) {
      return file.replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    async function boot() {
      try {
        const resp = await fetch('pages.json');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        pagesConfig = await resp.json();
      } catch (err) {
        showError(`無法載入 pages.json: ${err.message}`);
        return;
      }

      const site = pagesConfig.site || {};
      document.title = site.title || '旅遊寶典';
      siteTitle.textContent = site.title || '旅遊寶典';

      // Parse categories and pages
      let categories = [];
      allPages = [];

      if (Array.isArray(pagesConfig.categories)) {
        categories = pagesConfig.categories;
        categories.forEach((cat, catIdx) => {
          (cat.pages || []).forEach(p => {
            p.categoryIndex = catIdx;
            p.categoryName = cat.name;
            allPages.push(p);
          });
        });
      } else if (Array.isArray(pagesConfig.pages)) {
        categories = [{ name: '文章清單', pages: pagesConfig.pages }];
        pagesConfig.pages.forEach(p => {
          p.categoryIndex = 0;
          p.categoryName = '文章清單';
          allPages.push(p);
        });
      }

      if (allPages.length === 0) {
        showError('pages.json 中沒有設定任何頁面');
        return;
      }

      buildAccordion(categories);

      const hash = window.location.hash.slice(1);
      const target = allPages.find(p => slugify(p.file) === hash) || allPages[0];
      loadPage(target);
    }

    function buildAccordion(categories) {
      categoryListEl.innerHTML = '';

      categories.forEach((cat, catIdx) => {
        const group = document.createElement('div');
        group.className = 'category-group';
        group.dataset.catIndex = catIdx;

        const headerBtn = document.createElement('button');
        headerBtn.className = 'category-header';
        headerBtn.type = 'button';

        const titleWrap = document.createElement('div');
        titleWrap.className = 'category-title-wrap';

        const arrow = document.createElement('span');
        arrow.className = 'category-arrow';
        arrow.textContent = '>';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'category-name';
        nameSpan.textContent = cat.name;

        titleWrap.appendChild(arrow);
        titleWrap.appendChild(nameSpan);

        const countBadge = document.createElement('span');
        countBadge.className = 'category-count';
        countBadge.textContent = (cat.pages || []).length;

        headerBtn.appendChild(titleWrap);
        headerBtn.appendChild(countBadge);

        headerBtn.addEventListener('click', () => {
          group.classList.toggle('open');
        });

        const pagesContainer = document.createElement('div');
        pagesContainer.className = 'category-pages';

        (cat.pages || []).forEach(page => {
          const item = document.createElement('div');
          item.className = 'page-item';
          item.dataset.file = page.file;

          let descHtml = page.description ? `<span class="page-desc">${page.description}</span>` : '';
          item.innerHTML = `<div>${page.title}</div>${descHtml}`;

          item.addEventListener('click', () => {
            loadPage(page);
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('open');
          });

          pagesContainer.appendChild(item);
        });

        group.appendChild(headerBtn);
        group.appendChild(pagesContainer);
        categoryListEl.appendChild(group);
      });
    }

    function setActivePage(page) {
      document.querySelectorAll('.page-item').forEach(el => {
        el.classList.toggle('active', el.dataset.file === page.file);
      });

      // Ensure active category is open
      if (typeof page.categoryIndex === 'number') {
        const activeGroup = document.querySelector(`.category-group[data-cat-index="${page.categoryIndex}"]`);
        if (activeGroup && !activeGroup.classList.contains('open')) {
          activeGroup.classList.add('open');
        }
      }
    }

    async function loadPage(page) {
      currentPage = page;
      loadingEl.style.display = 'block';
      errorEl.style.display = 'none';
      tocEl.innerHTML = '';

      setActivePage(page);

      siteSubtitle.textContent = page.description || page.title;
      window.location.hash = slugify(page.file);

      try {
        const resp = await fetch(page.file);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
        const md = await resp.text();
        renderMarkdown(md);
        loadingEl.style.display = 'none';
      } catch (err) {
        showError(`無法載入 ${page.file}: ${err.message}\n\n提示：需透過 HTTP 伺服器開啟（不能用 file:// 直接開啟）\n* Python: python -m http.server 8000\n* Node.js: npx serve\n* VS Code: Live Server 擴充套件`);
      }
    }

    function renderMarkdown(md) {
      contentEl.innerHTML = marked.parse(md);
      generateTOC();

      contentEl.querySelectorAll('a[href^="http"]').forEach(a => {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      });

      window.scrollTo(0, 0);
    }

    function showError(msg) {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorDetail.textContent = msg;
    }

    function generateTOC() {
      tocEl.innerHTML = '';
      const headings = contentEl.querySelectorAll('h2, h3');

      headings.forEach((heading, i) => {
        const id = `section-${i}`;
        heading.id = id;

        const link = document.createElement('a');
        link.href = `#${id}`;
        link.textContent = heading.textContent;
        link.className = `toc-${heading.tagName.toLowerCase()}`;
        link.addEventListener('click', e => {
          e.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('open');
        });
        tocEl.appendChild(link);
      });

      setupScrollSpy(headings);
    }

    function setupScrollSpy(headings) {
      if (scrollObserver) scrollObserver.disconnect();
      const tocLinks = tocEl.querySelectorAll('a');

      scrollObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            tocLinks.forEach(l => l.classList.toggle('active', l.getAttribute('href') === `#${id}`));
            const active = tocEl.querySelector('a.active');
            if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        });
      }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });

      headings.forEach(h => scrollObserver.observe(h));
    }

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.slice(1);
      const page = allPages.find(p => slugify(p.file) === hash);
      if (page && page !== currentPage) loadPage(page);
    });

    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('open');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('open');
    });

    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    boot();
  </script>
</body>
</html>
